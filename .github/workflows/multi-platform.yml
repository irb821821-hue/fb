name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            platform: Windows
          - name: macOS
            os: macos-latest
            platform: macOS
          - name: iOS
            os: macos-latest
            platform: iOS
          - name: Android32
            os: ubuntu-latest
            platform: Android32
          - name: Android64
            os: ubuntu-latest
            platform: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # 1. Устанавливаем официальный Geode CLI
      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
         version: latest

      # 2. Устанавливаем бинарные файлы SDK (загружает geodeConfig.cmake и зависимости)
      - name: Install Geode SDK binaries
        run: geode sdk install-binaries

      # 3. Собираем сам мод
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          platform: ${{ matrix.config.platform }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: package
        
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.package.outputs.build-output }}
