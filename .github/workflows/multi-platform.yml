
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download compatible fmt
        id: fmt
        shell: bash
        run: |
          git clone --depth 1 --branch 11.1.4 \
            https://github.com/fmtlib/fmt.git \
            "$RUNNER_TEMP/fmt"

          if [ "$RUNNER_OS" = "Windows" ]; then
            FMT_SOURCE="$(cygpath -m "$RUNNER_TEMP/fmt")"
          else
            FMT_SOURCE="$RUNNER_TEMP/fmt"
          fi

          echo "source=$FMT_SOURCE" >> "$GITHUB_OUTPUT"

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.config.target }}
          combine: true
          configure-args: -DCPM_fmt_SOURCE=${{ steps.fmt.outputs.source }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: package

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.package.outputs.build-output }}
